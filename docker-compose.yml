version: '3.3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: promarket-api-app
    container_name: promarket-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - promarket-network

  webserver:
    image: nginx:alpine
    container_name: promarket-api-v2-web
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - promarket-network

networks:
  promarket-network:
    driver: bridge
